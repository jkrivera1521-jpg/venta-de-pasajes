quarkus.application.name=identity-service
quarkus.application.version=0.1.0-SNAPSHOT

app.environment=${APP_ENV:local}
app.runtime.target=${APP_RUNTIME_TARGET:local}
app.secrets.provider=${APP_SECRETS_PROVIDER:env}
app.secrets.local-file=${APP_SECRETS_LOCAL_FILE:}
app.database.name=${APP_DB_NAME:identity_db}
app.database.secret-name=${APP_DATABASE_SECRET_NAME:identity-service__db-connection}
app.security.jwt-signing-secret-name=${APP_JWT_SIGNING_SECRET_NAME:identity-service__jwt-signing-secret}
app.security.password-pepper-secret-name=${APP_PASSWORD_PEPPER_SECRET_NAME:identity-service__password-pepper}
app.security.recovery-token-pepper-secret-name=${APP_RECOVERY_TOKEN_PEPPER_SECRET_NAME:identity-service__recovery-token-pepper}
app.security.refresh-token-pepper-secret-name=${APP_REFRESH_TOKEN_PEPPER_SECRET_NAME:identity-service__refresh-token-pepper}
app.security.jwt-signing-secret=${APP_JWT_SIGNING_SECRET:local-dev-jwt-signing-secret-change-me-32-bytes}
app.security.password-pepper=${APP_PASSWORD_PEPPER:local-dev-password-pepper-change-me}
app.security.recovery-token-pepper=${APP_RECOVERY_TOKEN_PEPPER:local-dev-recovery-token-pepper-change-me}
app.security.jwt.issuer=${APP_JWT_ISSUER:identity-service}
app.security.jwt.audience=${APP_JWT_AUDIENCE:venta-pasajes}
app.security.jwt.access-token-ttl-seconds=${APP_JWT_ACCESS_TOKEN_TTL_SECONDS:3600}

app.auth.local.max-failed-attempts=${APP_AUTH_LOCAL_MAX_FAILED_ATTEMPTS:5}
app.auth.local.lockout-minutes=${APP_AUTH_LOCAL_LOCKOUT_MINUTES:15}
app.auth.password.pbkdf2.iterations=${APP_AUTH_PASSWORD_PBKDF2_ITERATIONS:210000}
app.auth.recovery-token-ttl-minutes=${APP_AUTH_RECOVERY_TOKEN_TTL_MINUTES:30}
app.auth.recovery.return-token.enabled=${APP_AUTH_RECOVERY_RETURN_TOKEN_ENABLED:false}
app.auth.google.client-ids=${APP_GOOGLE_CLIENT_IDS:local-google-client-placeholder}
app.auth.google.allowed-issuers=${APP_GOOGLE_ALLOWED_ISSUERS:https://accounts.google.com,accounts.google.com}
app.auth.google.jwks-url=${APP_GOOGLE_JWKS_URL:https://www.googleapis.com/oauth2/v3/certs}
app.auth.google.signature-required=${APP_GOOGLE_SIGNATURE_REQUIRED:true}
app.auth.google.dev-token.enabled=${APP_GOOGLE_DEV_TOKEN_ENABLED:false}
app.bootstrap.admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.login=${APP_BOOTSTRAP_ADMIN_LOGIN:}
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.display-name=${APP_BOOTSTRAP_ADMIN_DISPLAY_NAME:Administrador}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

quarkus.http.port=${QUARKUS_HTTP_PORT:8081}
quarkus.http.test-port=0
quarkus.http.non-application-root-path=/q

quarkus.jackson.property-naming-strategy=SNAKE_CASE
quarkus.native.resources.includes=db/migration/*.sql

quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.username=${APP_DB_USERNAME:identity_user}
quarkus.datasource.password=${APP_DB_PASSWORD:}
quarkus.datasource.jdbc.url=${APP_DB_JDBC_URL:jdbc:postgresql://localhost:5432/identity_db}
quarkus.datasource.jdbc.max-size=${QUARKUS_DATASOURCE_JDBC_MAX_SIZE:8}
quarkus.datasource.jdbc.min-size=${QUARKUS_DATASOURCE_JDBC_MIN_SIZE:0}

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=${QUARKUS_HIBERNATE_LOG_SQL:false}

quarkus.flyway.locations=db/migration
quarkus.flyway.migrate-at-start=${QUARKUS_FLYWAY_MIGRATE_AT_START:false}
quarkus.flyway.baseline-on-migrate=${QUARKUS_FLYWAY_BASELINE_ON_MIGRATE:false}

quarkus.log.level=${QUARKUS_LOG_LEVEL:INFO}
quarkus.log.category."com.ventapasajes".level=${QUARKUS_APP_LOG_LEVEL:INFO}
quarkus.log.console.json.enabled=${APP_LOG_CONSOLE_JSON:false}
quarkus.log.console.json.pretty-print=false
quarkus.log.console.json.exception-output-type=formatted

%prod.quarkus.log.console.json.enabled=true
%gcp.app.runtime.target=gcp
%gcp.app.secrets.provider=google-secret-manager
%gcp.quarkus.log.console.json.enabled=true
%gcp.quarkus.datasource.username=${APP_DB_USERNAME:identity-service-run@project-fbb34cd7-0b82-43e1-867.iam}
%gcp.quarkus.datasource.password=${APP_DB_PASSWORD:}
%gcp.quarkus.datasource.jdbc.url=${APP_DB_JDBC_URL:jdbc:postgresql:///identity_db?cloudSqlInstance=project-fbb34cd7-0b82-43e1-867:us-central1:venta-pasajes-dev-sql&socketFactory=com.google.cloud.sql.postgres.SocketFactory&enableIamAuth=true&sslmode=disable}

%onprem.app.runtime.target=onprem
%onprem.app.secrets.provider=${APP_SECRETS_PROVIDER:env}
%onprem.quarkus.log.console.json.enabled=${APP_LOG_CONSOLE_JSON:false}
%onprem.quarkus.datasource.username=${APP_DB_USERNAME:identity_user}
%onprem.quarkus.datasource.password=${APP_DB_PASSWORD:}
%onprem.quarkus.datasource.jdbc.url=${APP_DB_JDBC_URL:jdbc:postgresql://localhost:5432/identity_db}

%test.quarkus.log.console.json.enabled=false
%test.quarkus.datasource.health.enabled=false
%test.quarkus.hibernate-orm.enabled=false
%test.quarkus.flyway.enabled=false
%test.app.auth.google.client-ids=test-google-client
%test.app.auth.google.dev-token.enabled=true
%test.app.security.jwt-signing-secret=test-jwt-signing-secret-change-me-32-bytes
%test.app.security.password-pepper=test-password-pepper-change-me
%test.app.security.recovery-token-pepper=test-recovery-token-pepper-change-me
%test.app.auth.password.pbkdf2.iterations=1000

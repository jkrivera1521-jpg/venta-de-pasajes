quarkus.application.name=report-service
quarkus.application.version=0.1.0-SNAPSHOT

app.environment=${APP_ENV:local}
app.runtime.target=${APP_RUNTIME_TARGET:local}
app.secrets.provider=${APP_SECRETS_PROVIDER:env}
app.secrets.local-file=${APP_SECRETS_LOCAL_FILE:}
app.database.name=${APP_DB_NAME:report_db}
app.database.secret-name=${APP_DATABASE_SECRET_NAME:report-service__db-connection}

app.report.template.max-bytes=${APP_REPORT_TEMPLATE_MAX_BYTES:10485760}
app.report.batch.max-request-bytes=${APP_REPORT_BATCH_MAX_REQUEST_BYTES:52428800}
app.report.batch.max-documents=${APP_REPORT_BATCH_MAX_DOCUMENTS:500}
app.report.batch.expiration-hours=${APP_REPORT_BATCH_EXPIRATION_HOURS:24}
app.report.batch.parallelism=${APP_REPORT_BATCH_PARALLELISM:2}
app.report.parameters.strict=${APP_REPORT_PARAMETERS_STRICT:true}
app.report.pdf.enabled=${APP_REPORT_PDF_ENABLED:true}
app.report.pdf.max-bytes=${APP_REPORT_PDF_MAX_BYTES:52428800}
app.report.storage.provider=${APP_REPORT_STORAGE_PROVIDER:local}
app.report.storage.local-dir=${APP_REPORT_STORAGE_LOCAL_DIR:target/report-storage}
# Keep a non-empty placeholder so the local profile can boot without GCS.
# GCS still requires APP_REPORT_STORAGE_BUCKET when APP_REPORT_STORAGE_PROVIDER=gcs.
app.report.storage.bucket=${APP_REPORT_STORAGE_BUCKET:local-report-storage-bucket}
app.report.audit.mode=${APP_REPORT_AUDIT_MODE:local}
app.report.audit.url=${APP_REPORT_AUDIT_URL:}
app.report.audit.source-service=${APP_REPORT_AUDIT_SOURCE_SERVICE:report-service}
app.security.jwt-signing-secret=${APP_JWT_SIGNING_SECRET:}
app.security.jwt.issuer=${APP_JWT_ISSUER:identity-service}
app.security.jwt.audience=${APP_JWT_AUDIENCE:venta-pasajes}

quarkus.http.port=${QUARKUS_HTTP_PORT:8088}
quarkus.http.limits.max-body-size=${APP_REPORT_BATCH_MAX_REQUEST_BYTES:52428800}
quarkus.http.test-port=0
quarkus.http.non-application-root-path=/q

quarkus.jackson.property-naming-strategy=SNAKE_CASE

quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.username=${APP_DB_USERNAME:report_user}
quarkus.datasource.password=${APP_DB_PASSWORD:}
quarkus.datasource.jdbc.url=${APP_DB_JDBC_URL:jdbc:postgresql://localhost:5432/report_db}
quarkus.datasource.jdbc.max-size=${QUARKUS_DATASOURCE_JDBC_MAX_SIZE:8}
quarkus.datasource.jdbc.min-size=${QUARKUS_DATASOURCE_JDBC_MIN_SIZE:0}

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=${QUARKUS_HIBERNATE_LOG_SQL:false}

quarkus.flyway.locations=db/migration
quarkus.flyway.migrate-at-start=${QUARKUS_FLYWAY_MIGRATE_AT_START:false}
quarkus.flyway.baseline-on-migrate=${QUARKUS_FLYWAY_BASELINE_ON_MIGRATE:false}
quarkus.native.resources.includes=db/migration/*.sql

quarkus.log.level=${QUARKUS_LOG_LEVEL:INFO}
quarkus.log.category."com.ventapasajes".level=${QUARKUS_APP_LOG_LEVEL:INFO}
quarkus.log.console.json.enabled=${APP_LOG_CONSOLE_JSON:false}
quarkus.log.console.json.pretty-print=false
quarkus.log.console.json.exception-output-type=formatted

%prod.quarkus.log.console.json.enabled=true
%gcp.app.runtime.target=gcp
%gcp.app.secrets.provider=google-secret-manager
%gcp.quarkus.log.console.json.enabled=true
%gcp.quarkus.datasource.username=${APP_DB_USERNAME:report-service-run@project-fbb34cd7-0b82-43e1-867.iam}
%gcp.quarkus.datasource.password=${APP_DB_PASSWORD:}
%gcp.quarkus.datasource.jdbc.url=${APP_DB_JDBC_URL:jdbc:postgresql:///report_db?cloudSqlInstance=project-fbb34cd7-0b82-43e1-867:us-central1:venta-pasajes-dev-sql&socketFactory=com.google.cloud.sql.postgres.SocketFactory&enableIamAuth=true&sslmode=disable}

%onprem.app.runtime.target=onprem
%onprem.app.secrets.provider=${APP_SECRETS_PROVIDER:env}
%onprem.quarkus.log.console.json.enabled=${APP_LOG_CONSOLE_JSON:false}
%onprem.quarkus.datasource.username=${APP_DB_USERNAME:report_user}
%onprem.quarkus.datasource.password=${APP_DB_PASSWORD:}
%onprem.quarkus.datasource.jdbc.url=${APP_DB_JDBC_URL:jdbc:postgresql://localhost:5432/report_db}

%test.quarkus.log.console.json.enabled=false
%test.quarkus.datasource.health.enabled=false
%test.quarkus.hibernate-orm.enabled=false
%test.quarkus.flyway.enabled=false
%test.app.security.jwt-signing-secret=test-jwt-signing-secret-change-me-32-bytes

quarkus.application.name=quarkus-service-template
quarkus.application.version=0.1.0-SNAPSHOT

app.environment=${APP_ENV:local}
app.runtime.target=${APP_RUNTIME_TARGET:local}
app.secrets.provider=${APP_SECRETS_PROVIDER:env}
app.secrets.local-file=${APP_SECRETS_LOCAL_FILE:}
app.database.name=${APP_DB_NAME:template_db}
app.database.secret-name=${APP_DATABASE_SECRET_NAME:template-service__db-connection}

quarkus.http.port=${QUARKUS_HTTP_PORT:8080}
quarkus.http.test-port=0
quarkus.http.non-application-root-path=/q

quarkus.jackson.property-naming-strategy=SNAKE_CASE

quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.username=${APP_DB_USERNAME:template_user}
quarkus.datasource.password=${APP_DB_PASSWORD:}
quarkus.datasource.jdbc.url=${APP_DB_JDBC_URL:jdbc:postgresql://localhost:5432/template_db}
quarkus.datasource.jdbc.max-size=${QUARKUS_DATASOURCE_JDBC_MAX_SIZE:8}
quarkus.datasource.jdbc.min-size=${QUARKUS_DATASOURCE_JDBC_MIN_SIZE:0}

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=${QUARKUS_HIBERNATE_LOG_SQL:false}

quarkus.flyway.locations=db/migration
quarkus.flyway.migrate-at-start=${QUARKUS_FLYWAY_MIGRATE_AT_START:false}

quarkus.log.level=${QUARKUS_LOG_LEVEL:INFO}
quarkus.log.category."com.ventapasajes".level=${QUARKUS_APP_LOG_LEVEL:INFO}
quarkus.log.console.json.enabled=${APP_LOG_CONSOLE_JSON:false}
quarkus.log.console.json.pretty-print=false
quarkus.log.console.json.exception-output-type=formatted

%prod.quarkus.log.console.json.enabled=true
%gcp.app.runtime.target=gcp
%gcp.app.secrets.provider=google-secret-manager
%gcp.quarkus.log.console.json.enabled=true
%gcp.quarkus.datasource.username=${APP_DB_USERNAME:template-service-run@project-fbb34cd7-0b82-43e1-867.iam}
%gcp.quarkus.datasource.password=${APP_DB_PASSWORD:}
%gcp.quarkus.datasource.jdbc.url=${APP_DB_JDBC_URL:jdbc:postgresql:///template_db?cloudSqlInstance=project-fbb34cd7-0b82-43e1-867:us-central1:venta-pasajes-dev-sql&socketFactory=com.google.cloud.sql.postgres.SocketFactory&enableIamAuth=true&sslmode=disable}

%onprem.app.runtime.target=onprem
%onprem.app.secrets.provider=${APP_SECRETS_PROVIDER:env}
%onprem.quarkus.log.console.json.enabled=${APP_LOG_CONSOLE_JSON:false}
%onprem.quarkus.datasource.username=${APP_DB_USERNAME:template_user}
%onprem.quarkus.datasource.password=${APP_DB_PASSWORD:}
%onprem.quarkus.datasource.jdbc.url=${APP_DB_JDBC_URL:jdbc:postgresql://localhost:5432/template_db}

%test.quarkus.log.console.json.enabled=false
%test.quarkus.datasource.health.enabled=false
%test.quarkus.hibernate-orm.enabled=false
%test.quarkus.flyway.enabled=false

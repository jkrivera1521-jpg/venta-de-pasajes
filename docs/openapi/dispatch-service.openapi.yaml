openapi: 3.0.3
info:
  title: Dispatch Service API
  version: 0.1.0
  description: API para terminales, rutas, tipos de bus, buses, layouts de asientos y salidas programadas.
servers:
  - url: https://dispatch-service-dev.example.com/api/v1/dispatch
    description: Dev placeholder
security:
  - bearerAuth: []
tags:
  - name: health
  - name: terminals
  - name: routes
  - name: bus-types
  - name: seat-layouts
  - name: buses
  - name: departures
paths:
  /health:
    get:
      tags: [health]
      summary: Estado basico del servicio.
      security: []
      responses:
        "200":
          description: Servicio disponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /terminals:
    get:
      tags: [terminals]
      summary: Listar terminales.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: q
          in: query
          schema:
            type: string
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Terminales paginadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalPage"
    post:
      tags: [terminals]
      summary: Crear terminal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTerminalRequest"
      responses:
        "201":
          description: Terminal creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Terminal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Terminal duplicada.
  /terminals/{terminalId}:
    get:
      tags: [terminals]
      summary: Obtener terminal.
      parameters:
        - $ref: "#/components/parameters/TerminalId"
      responses:
        "200":
          description: Terminal encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Terminal"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [terminals]
      summary: Actualizar terminal.
      parameters:
        - $ref: "#/components/parameters/TerminalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTerminalRequest"
      responses:
        "200":
          description: Terminal actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Terminal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Terminal duplicada o en uso.
    delete:
      tags: [terminals]
      summary: Desactivar terminal.
      parameters:
        - $ref: "#/components/parameters/TerminalId"
      responses:
        "204":
          description: Terminal desactivada.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Terminal en uso por rutas o buses activos.
  /routes:
    get:
      tags: [routes]
      summary: Listar rutas.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: origin_terminal_id
          in: query
          schema:
            type: string
            format: uuid
        - name: destination_terminal_id
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          schema:
            type: string
          description: Busca por nombre de ruta, terminal origen o terminal destino.
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Rutas paginadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutePage"
    post:
      tags: [routes]
      summary: Crear ruta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRouteRequest"
      responses:
        "201":
          description: Ruta creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Ruta duplicada.
  /routes/{routeId}:
    get:
      tags: [routes]
      summary: Obtener ruta.
      parameters:
        - $ref: "#/components/parameters/RouteId"
      responses:
        "200":
          description: Ruta encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [routes]
      summary: Actualizar ruta.
      parameters:
        - $ref: "#/components/parameters/RouteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRouteRequest"
      responses:
        "200":
          description: Ruta actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Ruta duplicada.
    delete:
      tags: [routes]
      summary: Desactivar ruta.
      parameters:
        - $ref: "#/components/parameters/RouteId"
      responses:
        "204":
          description: Ruta desactivada.
        "404":
          $ref: "#/components/responses/NotFound"
  /bus-types:
    get:
      tags: [bus-types]
      summary: Listar tipos de bus.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: q
          in: query
          schema:
            type: string
          description: Busca por nombre o descripcion.
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Tipos de bus paginados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusTypePage"
    post:
      tags: [bus-types]
      summary: Crear tipo de bus.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBusTypeRequest"
      responses:
        "201":
          description: Tipo de bus creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Tipo de bus duplicado.
  /bus-types/{busTypeId}:
    get:
      tags: [bus-types]
      summary: Obtener tipo de bus.
      parameters:
        - $ref: "#/components/parameters/BusTypeId"
      responses:
        "200":
          description: Tipo de bus encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusType"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [bus-types]
      summary: Actualizar tipo de bus.
      parameters:
        - $ref: "#/components/parameters/BusTypeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBusTypeRequest"
      responses:
        "200":
          description: Tipo de bus actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Tipo de bus duplicado.
    delete:
      tags: [bus-types]
      summary: Desactivar tipo de bus.
      parameters:
        - $ref: "#/components/parameters/BusTypeId"
      responses:
        "204":
          description: Tipo de bus desactivado.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Tipo de bus en uso por buses activos.
  /seat-layouts:
    get:
      tags: [seat-layouts]
      summary: Listar layouts de asientos.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: q
          in: query
          schema:
            type: string
          description: Busca por nombre del layout.
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Layouts paginados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatLayoutPage"
    post:
      tags: [seat-layouts]
      summary: Crear layout de asientos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSeatLayoutRequest"
      responses:
        "201":
          description: Layout creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatLayout"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Layout duplicado.
  /seat-layouts/{seatLayoutId}:
    get:
      tags: [seat-layouts]
      summary: Obtener layout de asientos.
      parameters:
        - $ref: "#/components/parameters/SeatLayoutId"
      responses:
        "200":
          description: Layout encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatLayout"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [seat-layouts]
      summary: Actualizar layout de asientos.
      parameters:
        - $ref: "#/components/parameters/SeatLayoutId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSeatLayoutRequest"
      responses:
        "200":
          description: Layout actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatLayout"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Layout duplicado o en uso por buses activos.
    delete:
      tags: [seat-layouts]
      summary: Desactivar layout de asientos.
      parameters:
        - $ref: "#/components/parameters/SeatLayoutId"
      responses:
        "204":
          description: Layout desactivado.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Layout en uso por buses activos.
  /buses:
    get:
      tags: [buses]
      summary: Listar buses.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: q
          in: query
          schema:
            type: string
          description: Busca por codigo, placa, descripcion, destino, tipo de bus o terminal.
        - name: terminal_id
          in: query
          schema:
            type: string
            format: uuid
        - name: bus_type_id
          in: query
          schema:
            type: string
            format: uuid
        - name: seat_layout_id
          in: query
          schema:
            type: string
            format: uuid
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Buses paginados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusPage"
    post:
      tags: [buses]
      summary: Crear bus.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBusRequest"
      responses:
        "201":
          description: Bus creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Bus duplicado.
  /buses/{busId}:
    get:
      tags: [buses]
      summary: Obtener bus.
      parameters:
        - $ref: "#/components/parameters/BusId"
      responses:
        "200":
          description: Bus encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bus"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [buses]
      summary: Actualizar bus.
      parameters:
        - $ref: "#/components/parameters/BusId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBusRequest"
      responses:
        "200":
          description: Bus actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Bus duplicado.
    delete:
      tags: [buses]
      summary: Desactivar bus.
      parameters:
        - $ref: "#/components/parameters/BusId"
      responses:
        "204":
          description: Bus desactivado.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Bus en uso por salidas programadas.
  /departures:
    get:
      tags: [departures]
      summary: Listar salidas programadas.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: route_id
          in: query
          schema:
            type: string
            format: uuid
        - name: bus_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DepartureStatus"
      responses:
        "200":
          description: Salidas paginadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeparturePage"
    post:
      tags: [departures]
      summary: Programar salida.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDepartureRequest"
      responses:
        "201":
          description: Salida programada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Departure"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Bus con conflicto de horario.
  /departures/{departureId}:
    get:
      tags: [departures]
      summary: Obtener salida.
      parameters:
        - $ref: "#/components/parameters/DepartureId"
      responses:
        "200":
          description: Salida encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Departure"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [departures]
      summary: Actualizar salida programada.
      parameters:
        - $ref: "#/components/parameters/DepartureId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDepartureRequest"
      responses:
        "200":
          description: Salida actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Departure"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Salida cancelada o bus con conflicto de horario.
    delete:
      tags: [departures]
      summary: Cancelar salida programada.
      parameters:
        - $ref: "#/components/parameters/DepartureId"
      responses:
        "204":
          description: Salida cancelada.
        "404":
          $ref: "#/components/responses/NotFound"
  /departures/{departureId}/cancel:
    post:
      tags: [departures]
      summary: Cancelar salida.
      parameters:
        - $ref: "#/components/parameters/DepartureId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelDepartureRequest"
      responses:
        "200":
          description: Salida cancelada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Departure"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    TerminalId:
      name: terminalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RouteId:
      name: routeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BusTypeId:
      name: busTypeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SeatLayoutId:
      name: seatLayoutId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BusId:
      name: busId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DepartureId:
      name: departureId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Solicitud invalida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status, service, runtime]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: dispatch-service
        runtime:
          type: string
          example: quarkus
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        correlation_id:
          type: string
          format: uuid
    PageMeta:
      type: object
      required: [page, page_size, total_items, total_pages]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
    Terminal:
      type: object
      required: [id, name, active]
      properties:
        id:
          type: string
          format: uuid
        legacy_id:
          type: integer
        local_code:
          type: string
        name:
          type: string
        manager_name:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TerminalPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Terminal"
        meta:
          $ref: "#/components/schemas/PageMeta"
    CreateTerminalRequest:
      type: object
      required: [name]
      properties:
        legacy_id:
          type: integer
        local_code:
          type: string
        name:
          type: string
        manager_name:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        active:
          type: boolean
    UpdateTerminalRequest:
      type: object
      properties:
        legacy_id:
          type: integer
        local_code:
          type: string
        name:
          type: string
        manager_name:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        active:
          type: boolean
    Route:
      type: object
      required: [id, origin_terminal_id, destination_terminal_id, name, active]
      properties:
        id:
          type: string
          format: uuid
        origin_terminal_id:
          type: string
          format: uuid
        origin_terminal_name:
          type: string
        destination_terminal_id:
          type: string
          format: uuid
        destination_terminal_name:
          type: string
        name:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RoutePage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Route"
        meta:
          $ref: "#/components/schemas/PageMeta"
    CreateRouteRequest:
      type: object
      required: [origin_terminal_id, destination_terminal_id]
      properties:
        origin_terminal_id:
          type: string
          format: uuid
        destination_terminal_id:
          type: string
          format: uuid
        name:
          type: string
        active:
          type: boolean
          default: true
    UpdateRouteRequest:
      type: object
      properties:
        origin_terminal_id:
          type: string
          format: uuid
        destination_terminal_id:
          type: string
          format: uuid
        name:
          type: string
        active:
          type: boolean
    BusType:
      type: object
      required: [id, name, active]
      properties:
        id:
          type: string
          format: uuid
        legacy_id:
          type: integer
        name:
          type: string
        description:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BusTypePage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BusType"
        meta:
          $ref: "#/components/schemas/PageMeta"
    CreateBusTypeRequest:
      type: object
      required: [name]
      properties:
        legacy_id:
          type: integer
        name:
          type: string
        description:
          type: string
        active:
          type: boolean
    UpdateBusTypeRequest:
      type: object
      properties:
        legacy_id:
          type: integer
        name:
          type: string
        description:
          type: string
        active:
          type: boolean
    SeatPosition:
      type: string
      enum: [WINDOW, AISLE, MIDDLE, DRIVER, BLOCKED]
    SeatDefinition:
      type: object
      required: [seat_number, row_number, column_number, position]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        seat_number:
          type: integer
          minimum: 1
        label:
          type: string
        row_number:
          type: integer
          minimum: 1
        column_number:
          type: integer
          minimum: 1
        position:
          $ref: "#/components/schemas/SeatPosition"
        active:
          type: boolean
    SeatLayout:
      type: object
      required: [id, name, seat_count, active, seats]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        seat_count:
          type: integer
          example: 25
        active:
          type: boolean
        seats:
          type: array
          items:
            $ref: "#/components/schemas/SeatDefinition"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SeatLayoutPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SeatLayout"
        meta:

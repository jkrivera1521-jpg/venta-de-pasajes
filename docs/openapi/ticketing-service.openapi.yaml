openapi: 3.0.3
info:
  title: Ticketing Service API
  version: 0.1.0
  description: API para disponibilidad de asientos, pasajeros, reservas, boletos, anulaciones y documentos de boleto.
servers:
  - url: https://ticketing-service-dev.example.com/api/v1
    description: Dev placeholder
security:
  - bearerAuth: []
tags:
  - name: availability
  - name: passengers
  - name: reservations
  - name: tickets
  - name: ticket-documents
paths:
  /health:
    get:
      tags: [availability]
      summary: Estado basico del servicio.
      security: []
      responses:
        "200":
          description: Servicio disponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /departures:
    get:
      tags: [availability]
      summary: Buscar salidas disponibles para venta.
      parameters:
        - name: origin_terminal_id
          in: query
          schema:
            type: string
            format: uuid
        - name: destination_terminal_id
          in: query
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: only_available
          in: query
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Salidas disponibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SellableDeparture"
  /departures/{departureId}/seats:
    get:
      tags: [availability]
      summary: Consultar mapa de asientos por salida.
      parameters:
        - $ref: "#/components/parameters/DepartureId"
      responses:
        "200":
          description: Disponibilidad por asiento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatMap"
  /passengers:
    get:
      tags: [passengers]
      summary: Buscar pasajeros por nombre o documento.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: q
          in: query
          schema:
            type: string
        - name: document_number
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Pasajeros paginados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PassengerPage"
    post:
      tags: [passengers]
      summary: Crear pasajero.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePassengerRequest"
      responses:
        "201":
          description: Pasajero creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passenger"
  /reservations:
    post:
      tags: [reservations]
      summary: Reservar temporalmente un asiento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
      responses:
        "201":
          description: Reserva creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "409":
          $ref: "#/components/responses/SeatConflict"
  /reservations/{reservationId}:
    delete:
      tags: [reservations]
      summary: Liberar reserva temporal.
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "204":
          description: Reserva liberada.
  /tickets:
    post:
      tags: [tickets]
      summary: Vender boleto.
      description: Debe ejecutarse con transaccion local y restriccion unica por salida/asiento activo.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellTicketRequest"
      responses:
        "201":
          description: Boleto vendido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "409":
          $ref: "#/components/responses/SeatConflict"
  /tickets/{ticketId}:
    get:
      tags: [tickets]
      summary: Obtener boleto.
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Boleto encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "404":
          $ref: "#/components/responses/NotFound"
  /tickets/{ticketId}/cancel:
    post:
      tags: [tickets]
      summary: Anular boleto.
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelTicketRequest"
      responses:
        "200":
          description: Boleto anulado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
  /tickets/{ticketId}/document:
    get:
      tags: [ticket-documents]
      summary: Obtener referencia documental del boleto.
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Documento generado asociado al boleto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDocument"
        "404":
          $ref: "#/components/responses/NotFound"
  /tickets/{ticketId}/document/reprint:
    post:
      tags: [ticket-documents]
      summary: Obtener o regenerar la referencia imprimible del boleto.
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Documento listo para reimpresion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDocument"
        "409":
          $ref: "#/components/responses/Conflict"
  /documents/process-pending:
    post:
      tags: [ticket-documents]
      summary: Procesar eventos TicketSold pendientes y generar PDFs.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Resultado del procesamiento documental.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessTicketDocumentsResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    DepartureId:
      name: departureId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SeatConflict:
      description: Asiento no disponible o conflicto de venta.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: La operacion no puede completarse por el estado actual del recurso.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: SEAT_NOT_AVAILABLE
        message:
          type: string
        correlation_id:
          type: string
          format: uuid
    PageMeta:
      type: object
      required: [page, page_size, total_items, total_pages]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
    SellableDeparture:
      type: object
      required: [departure_id, bus_code, origin, destination, departure_at, available_seats]
      properties:
        departure_id:
          type: string
          format: uuid
        bus_code:
          type: string
        bus_type:
          type: string
        origin:
          type: string
        destination:
          type: string
        departure_at:
          type: string
          format: date-time
        available_seats:
          type: integer
        total_seats:
          type: integer
    SeatStatus:
      type: string
      enum: [FREE, RESERVED, SOLD, BLOCKED]
    SeatAvailability:
      type: object
      required: [seat_number, position, status]
      properties:
        seat_number:
          type: integer
        label:
          type: string
        position:
          type: string
          enum: [WINDOW, AISLE, MIDDLE]
        status:
          $ref: "#/components/schemas/SeatStatus"
        reservation_expires_at:
          type: string
          format: date-time
    SeatMap:
      type: object
      required: [departure_id, seats]
      properties:
        departure_id:
          type: string
          format: uuid
        seats:
          type: array
          items:
            $ref: "#/components/schemas/SeatAvailability"
    Passenger:
      type: object
      required: [id, first_name, last_name, document_number]
      properties:
        id:
          type: string
          format: uuid
        legacy_id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        document_type:
          type: string
          example: DNI
        document_number:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
    PassengerPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Passenger"
        meta:
          $ref: "#/components/schemas/PageMeta"
    CreatePassengerRequest:
      type: object
      required: [first_name, last_name, document_number]
      properties:
        legacy_id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        document_type:
          type: string
          default: DNI
        document_number:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
    Reservation:
      type: object
      required: [id, departure_id, seat_number, status, expires_at]
      properties:
        id:
          type: string
          format: uuid
        departure_id:
          type: string
          format: uuid
        seat_number:
          type: integer
        status:
          type: string
          enum: [ACTIVE, EXPIRED, RELEASED, CONVERTED_TO_TICKET]
        expires_at:
          type: string
          format: date-time
    CreateReservationRequest:
      type: object
      required: [departure_id, seat_number]
      properties:
        departure_id:
          type: string
          format: uuid
        seat_number:
          type: integer
        hold_minutes:
          type: integer
          minimum: 1
          maximum: 30
          default: 10
    PaymentMethod:
      type: string
      enum: [CASH, CARD, TRANSFER, OTHER]
    TicketStatus:
      type: string
      enum: [SOLD, CANCELLED]
    SellTicketRequest:
      type: object
      required: [departure_id, seat_number, passenger, price, payment_method]
      properties:
        reservation_id:
          type: string
          format: uuid
        departure_id:
          type: string
          format: uuid
        seat_number:
          type: integer
        passenger_id:
          type: string
          format: uuid
        passenger:
          $ref: "#/components/schemas/CreatePassengerRequest"
        price:
          type: number
          format: double
          minimum: 0
        currency:
          type: string
          default: PEN
        payment_method:
          $ref: "#/components/schemas/PaymentMethod"
        notes:
          type: string
    Ticket:
      type: object
      required: [id, ticket_number, departure_id, seat_number, passenger, price, currency, status, sold_at, sold_by_user_id]
      properties:
        id:
          type: string
          format: uuid
        legacy_id:
          type: integer
        ticket_number:
          type: string
        departure_id:
          type: string
          format: uuid
        departure_snapshot:
          $ref: "#/components/schemas/DepartureSnapshot"
        seat_number:
          type: integer
        seat_position:
          type: string
        passenger:
          $ref: "#/components/schemas/Passenger"
        price:
          type: number
          format: double
        currency:
          type: string
        status:
          $ref: "#/components/schemas/TicketStatus"
        sold_at:
          type: string
          format: date-time
        sold_by_user_id:
          type: string
          format: uuid
        cancelled_at:
          type: string
          format: date-time
        cancellation_reason:
          type: string
    DepartureSnapshot:
      type: object
      properties:
        bus_code:
          type: string
        bus_type:
          type: string
        origin:
          type: string
        destination:
          type: string
        departure_at:
          type: string
          format: date-time
    CancelTicketRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
        refund_amount:
          type: number
          format: double
          minimum: 0
    TicketDocumentStatus:
      type: string
      enum: [PENDING, GENERATED, FAILED]
    TicketDocument:
      type: object
      required: [ticket_id, ticket_number, source_event_id, status, attempts]
      properties:
        ticket_id:
          type: string
          format: uuid
        ticket_number:
          type: string
        document_id:
          type: string
          format: uuid
        source_event_id:
          type: string
          format: uuid
        document_event_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/TicketDocumentStatus"
        storage_provider:
          type: string
        storage_uri:
          type: string
        download_url:
          type: string
          format: uri
        content_type:
          type: string
          example: application/pdf
        file_name:
          type: string
        checksum_sha256:
          type: string
        size_bytes:
          type: integer
          format: int64
        attempts:
          type: integer
        last_attempt_at:
          type: string
          format: date-time
        next_attempt_at:
          type: string
          format: date-time
        generated_at:
          type: string
          format: date-time
        failure_reason:
          type: string
    ProcessTicketDocumentsResponse:
      type: object
      required: [inspected_events, generated_documents, failed_attempts, skipped_events, integration_enabled]
      properties:
        inspected_events:
          type: integer
        generated_documents:
          type: integer
        failed_attempts:
          type: integer
        skipped_events:
          type: integer
        integration_enabled:
          type: boolean

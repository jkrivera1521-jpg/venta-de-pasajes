openapi: 3.0.3
info:
  title: Audit Service API
  version: 0.1.0
  description: API inicial para consulta de auditoria funcional y eventos inmutables.
servers:
  - url: https://audit-service-dev.example.com/api/v1
    description: Dev placeholder
security:
  - bearerAuth: []
tags:
  - name: audit-events
paths:
  /audit:
    get:
      tags: [audit-events]
      summary: Resumen del servicio de auditoria.
      security: []
      responses:
        "200":
          description: Resumen disponible.
  /audit/resources:
    get:
      tags: [audit-events]
      summary: Recursos implementados por el servicio.
      security: []
      responses:
        "200":
          description: Recursos disponibles.
  /audit/health:
    get:
      tags: [audit-events]
      summary: Estado basico del servicio.
      security: []
      responses:
        "200":
          description: Servicio disponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /audit/audit-events:
    get:
      tags: [audit-events]
      summary: Consultar eventos auditables.
      parameters:
        - name: occurred_from
          in: query
          schema:
            type: string
            format: date-time
        - name: occurred_to
          in: query
          schema:
            type: string
            format: date-time
        - name: actor_user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: resource_type
          in: query
          schema:
            type: string
        - name: resource_id
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: correlation_id
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Eventos paginados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
    post:
      tags: [audit-events]
      summary: Registrar evento auditable desde integracion interna.
      description: Endpoint interno complementario a consumo Pub/Sub; debe ser idempotente por `event_id`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuditEventRequest"
      responses:
        "202":
          description: Evento aceptado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEvent"
  /audit/audit-events/{eventId}:
    get:
      tags: [audit-events]
      summary: Obtener evento auditable.
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Evento encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEvent"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP
    PageMeta:
      type: object
      required: [page, page_size, total_items, total_pages]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
    AuditEvent:
      type: object
      required: [event_id, event_type, schema_version, occurred_at, source_service, correlation_id, action]
      properties:
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
          example: TicketSold
        schema_version:
          type: integer
          example: 1
        occurred_at:
          type: string
          format: date-time
        ingested_at:
          type: string
          format: date-time
        source_service:
          type: string
          example: ticketing-service
        correlation_id:
          type: string
          format: uuid
        actor_user_id:
          type: string
          format: uuid
        action:
          type: string
          example: ticket.sold
        resource_type:
          type: string
          example: ticket
        resource_id:
          type: string
        payload:
          type: object
          additionalProperties: true
    AuditEventPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        meta:
          $ref: "#/components/schemas/PageMeta"
    CreateAuditEventRequest:
      allOf:
        - $ref: "#/components/schemas/AuditEvent"

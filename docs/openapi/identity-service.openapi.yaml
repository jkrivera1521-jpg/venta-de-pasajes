openapi: 3.0.3
info:
  title: Identity Service API
  version: 0.1.0
  description: API inicial para autenticacion local, identidades Google, roles y permisos.
servers:
  - url: https://identity-service-dev.example.com/api/v1
    description: Dev placeholder
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: users
  - name: roles
  - name: permissions
paths:
  /health:
    get:
      tags: [auth]
      summary: Estado basico del servicio.
      security: []
      responses:
        "200":
          description: Servicio disponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /auth/local/login:
    post:
      tags: [auth]
      summary: Iniciar sesion con usuario local.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalLoginRequest"
      responses:
        "200":
          description: Sesion iniciada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/local/register:
    post:
      tags: [auth]
      summary: Registrar cuenta publica local e iniciar sesion.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicLocalRegisterRequest"
      responses:
        "201":
          description: Cuenta local creada y autenticada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          description: Datos invalidos o contrasena menor a 12 caracteres.
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/google/exchange:
    post:
      tags: [auth]
      summary: Validar ID token de Google y emitir token interno.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleTokenExchangeRequest"
      responses:
        "200":
          description: Token Google validado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      tags: [auth]
      summary: Cerrar todas las sesiones activas del usuario autenticado.
      responses:
        "204":
          description: Todas las sesiones del usuario fueron revocadas.
  /me:
    get:
      tags: [auth]
      summary: Obtener perfil y permisos del usuario autenticado.
      responses:
        "200":
          description: Perfil autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users:
    get:
      tags: [users]
      summary: Listar usuarios internos.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Sort"
        - name: q
          in: query
          schema:
            type: string
          description: Texto de busqueda por login, correo, nombres o apellidos.
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/UserStatus"
      responses:
        "200":
          description: Usuarios listados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      tags: [users]
      summary: Crear usuario interno local desde el MFE Identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Usuario creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          $ref: "#/components/responses/Conflict"
  /users/{userId}:
    get:
      tags: [users]
      summary: Obtener usuario por ID.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Usuario encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [users]
      summary: Actualizar datos y roles de un usuario.
      description: El correo de cuentas GOOGLE es inmutable. Login y correo deben ser unicos. Incluir role_ids requiere identity.roles.manage; datos y roles se guardan en una sola transaccion.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Usuario actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Datos invalidos o intento de modificar el correo de una cuenta GOOGLE.
        "403":
          description: Sin permiso para modificar el usuario o sus roles.
        "409":
          description: Usuario o correo duplicado. EMAIL_REGISTERED_WITH_GOOGLE indica que el correo pertenece a una cuenta GOOGLE.
  /users/{userId}/logout:
    post:
      tags: [users, sessions]
      summary: Cerrar todas las sesiones activas de un usuario.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Sesiones del usuario revocadas.
        "403":
          $ref: "#/components/responses/Forbidden"
  /users/{userId}/roles:
    put:
      tags: [users, roles]
      summary: Reemplazar roles asignados a un usuario.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_ids]
              properties:
                role_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Roles actualizados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /sessions:
    get:
      tags: [sessions]
      summary: Listar sesiones activas de identidad.
      responses:
        "200":
          description: Sesiones activas en todos los clientes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IdentitySession"
  /sessions/{sessionId}/revoke:
    post:
      tags: [sessions]
      summary: Revocar una sesion de identidad.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Sesion revocada.
  /users/{userId}/activate:
    post:
      tags: [users]
      summary: Activar usuario.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Usuario activado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{userId}/suspend:
    post:
      tags: [users]
      summary: Suspender usuario.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusReasonRequest"
      responses:
        "200":
          description: Usuario suspendido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /roles:
    get:
      tags: [roles]
      summary: Listar roles.
      responses:
        "200":
          description: Roles disponibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
    post:
      tags: [roles]
      summary: Crear rol.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: Rol creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
  /permissions:
    get:
      tags: [permissions]
      summary: Listar permisos conocidos por el sistema.
      responses:
        "200":
          description: Permisos disponibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
  /password/forgot:
    post:
      tags: [auth]
      summary: Solicitar recuperacion de acceso.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordForgotRequest"
      responses:
        "202":
          description: Solicitud aceptada para una cuenta existente. LOCAL recibe enlace para cambiar clave; GOOGLE recibe enlace de acceso directo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordForgotResponse"
        "404":
          description: No existe una cuenta registrada con ese correo.
        "409":
          description: La cuenta existe, pero no tiene credencial local recuperable.
  /password/login:
    post:
      tags: [auth]
      summary: Iniciar sesion usando enlace temporal de acceso.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequest"
      responses:
        "200":
          description: Sesion iniciada con token temporal de acceso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
  /password/reset:
    post:
      tags: [auth]
      summary: Cambiar contrasena usando token temporal.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  format: password
                  minLength: 12
      responses:
        "200":
          description: Contrasena actualizada y sesion iniciada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Sort:
      name: sort
      in: query
      schema:
        type: string
      description: Campo opcional prefijado con - para descendente.
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: No autenticado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflicto de negocio o unicidad.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        field_errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        correlation_id:
          type: string
          format: uuid
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    AuthTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
        user:
          $ref: "#/components/schemas/CurrentUser"
    LocalLoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
        password:
          type: string
          format: password
        force:
          type: boolean
          default: false
          description: Revoca las sesiones anteriores despues de confirmar el inicio unico.
    GoogleTokenExchangeRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
        force:
          type: boolean
          default: false
          description: Revoca las sesiones anteriores despues de confirmar el inicio unico.
    PublicLocalRegisterRequest:
      type: object
      required: [login, email, display_name, password]
      properties:
        login:
          type: string
          description: Usuario local unico para ingresar al sistema.
        email:
          type: string
          format: email
          description: Correo unico asociado a la cuenta.
        display_name:
          type: string
        password:
          type: string
          format: password
          minLength: 12
    IdentityType:
      type: string
      enum: [GOOGLE, LOCAL]
    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, LOCKED, RETIRED, PENDING_ACTIVATION]
    CurrentUser:
      type: object
      required: [id, login, display_name, status, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        status:
          $ref: "#/components/schemas/UserStatus"
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    User:
      type: object
      required: [id, identity_type, login, display_name, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        legacy_id:
          type: integer
        identity_type:
          $ref: "#/components/schemas/IdentityType"
        login:
          type: string
        email:
          type: string
          format: email
        google_subject:
          type: string
        display_name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        employee_code:
          type: string
        phone:
          type: string
        address:
          type: string
        job_title:
          type: string
        status:
          $ref: "#/components/schemas/UserStatus"
        roles:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
        locked_until:
          type: string
          format: date-time
    UserPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        meta:
          $ref: "#/components/schemas/PageMeta"
    PageMeta:
      type: object
      required: [page, page_size, total_items, total_pages]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
    CreateUserRequest:
      type: object
      required: [login, email, display_name, temporary_password]
      properties:
        login:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        employee_code:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        address:
          type: string
        job_title:
          type: string
        temporary_password:
          type: string
          format: password
          minLength: 12
        role_ids:
          type: array
          items:
            type: string
            format: uuid
    UpdateUserRequest:
      type: object
      properties:
        login:
          type: string
        email:
          type: string
          format: email
          description: Editable solo en cuentas LOCAL; debe ser unico entre todas las cuentas.
        display_name:
          type: string
        employee_code:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        address:
          type: string
        job_title:
          type: string
        role_ids:
          type: array
          description: Omitir conserva los roles; una lista vacia los retira. Requiere identity.roles.manage.
          items:
            type: string
            format: uuid
    IdentitySession:
      type: object
      required: [id, user_id, login, display_name, identity_type, user_status, created_at, last_seen_at, expires_at, current]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        login:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        identity_type:
          type: string
          enum: [LOCAL, GOOGLE]
        user_status:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        user_agent:
          type: string
        device_name:
          type: string
        device_type:
          type: string
        operating_system:
          type: string
        browser:
          type: string
        browser_version:
          type: string
        location:
          type: string
        ip_address:
          type: string
        current:
          type: boolean
    StatusReasonRequest:
      type: object
      properties:
        reason:
          type: string
    Role:
      type: object
      required: [id, code, name, active, permissions]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: TICKET_SELLER
        name:
          type: string
        description:
          type: string
        active:
          type: boolean
        permissions:
          type: array
          items:
            type: string
    Permission:
      type: object
      required: [code, description]
      properties:
        code:
          type: string
          example: ticketing.tickets.sell
        description:
          type: string
    CreateRoleRequest:
      type: object
      required: [code, name, permission_codes]
      properties:
        code:
          type: string
        name:
          type: string
        permission_codes:
          type: array
          items:
            type: string
    PasswordForgotRequest:
      type: object
      required: [login_or_email]
      properties:
        login_or_email:
          type: string
    PasswordForgotResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
        recovery_token:
          type: string
          nullable: true
          description: Solo se devuelve cuando APP_AUTH_RECOVERY_RETURN_TOKEN_ENABLED=true para pruebas controladas.
    PasswordLoginRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string

openapi: 3.0.3
info:
  title: AviatorScript Service API
  version: 0.1.0
  description: Ejecuta formulas versionadas almacenadas en PostgreSQL mediante AviatorScript y administra su ciclo de vida.
security:
  - bearerAuth: []
servers:
  - url: http://localhost:8087
paths:
  /api/v1/calculos/formulas:
    get:
      summary: Lista formulas guardadas disponibles como plantillas
      description: Devuelve todas las versiones almacenadas, incluidas las inactivas, para usarlas como plantillas y consultar su ciclo de vida.
      operationId: listarFormulas
      responses:
        '200':
          description: Catalogo ordenado por codigo y version descendente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FormulaTemplate'
        '500':
          description: No se pudo consultar el catalogo de formulas.
    post:
      summary: Guarda una nueva version en borrador
      description: Crea una version inmutable en estado BORRADOR para el codigo indicado y conserva el ejemplo JSON de prueba.
      operationId: guardarFormula
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormulaSaveRequest'
      responses:
        '201':
          description: Nueva version guardada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormulaTemplate'
        '400':
          description: Los datos de la formula no cumplen las validaciones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: No se pudo guardar la formula.
  /api/v1/calculos/formulas/{id}/publicar:
    post:
      summary: Publica una version guardada
      operationId: publicarFormula
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormulaLifecycleRequest'
      responses:
        '200':
          description: Version publicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormulaTemplate'
        '404':
          description: No existe la version solicitada.
        '400':
          description: La transicion no es valida.
  /api/v1/calculos/formulas/{id}/activar:
    post:
      summary: Activa una version publicada
      operationId: activarFormula
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormulaLifecycleRequest'
      responses:
        '200':
          description: Version activa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormulaTemplate'
        '404':
          description: No existe la version solicitada.
        '400':
          description: Solo se pueden activar versiones publicadas.
  /api/v1/calculos/ejecutar:
    post:
      summary: Ejecuta una formula activa
      operationId: ejecutarCalculo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculoRequest'
      responses:
        '200':
          description: Formula ejecutada correctamente o error de evaluacion controlado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculoResponse'
        '400':
          description: La solicitud no cumple las validaciones de entrada o la formula lanzo un error de validacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculoResponse'
        '404':
          description: No existe una formula activa con el codigo solicitado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculoResponse'
  /api/v1/calculos/validar:
    post:
      summary: Valida codigo AviatorScript con el motor real
      description: Compila la fuente sin persistirla ni ejecutarla y devuelve diagnosticos del engine.
      operationId: validarAviatorScript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AviatorSourceRequest'
      responses:
        '200':
          description: Resultado de compilacion y diagnosticos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AviatorValidationResponse'
        '400':
          description: La solicitud no contiene source.
  /api/v1/calculos/probar:
    post:
      summary: Prueba codigo AviatorScript sin persistirlo
      description: Ejecuta la fuente y devuelve el resultado usando el mismo motor que /ejecutar.
      operationId: probarAviatorScript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AviatorSourceTestRequest'
      responses:
        '200':
          description: Resultado de la ejecucion o error controlado del motor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AviatorSourceTestResponse'
        '400':
          description: La solicitud no contiene source o parametros validos.
  /api/v1/aviator/visualize:
    post:
      summary: Analiza codigo AviatorScript y devuelve un grafo de flujo
      description: Analisis estatico sin compilar ni ejecutar el codigo. El resultado sirve para el visualizador del MFE.
      operationId: visualizarAviatorScript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AviatorVisualizationRequest'
      responses:
        '200':
          description: Grafo de control, mapeo a codigo y diagnosticos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AviatorVisualizationResponse'
        '400':
          description: El cuerpo no contiene source.
        '413':
          description: El codigo supera los limites de analisis.
  /q/health:
    get:
      summary: Estado de salud del servicio
      operationId: health
      security: []
      responses:
        '200':
          description: Estado de salud de Quarkus.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    FormulaTemplate:
      type: object
      description: Vista de solo lectura de una formula almacenada, para copiar su expresion y su ejemplo de prueba como nueva plantilla en el editor. Las formulas historicas pueden no tener descripcion ni ejemplo.
      required:
        - id
        - codigo
        - nombre
        - version
        - expresion
        - activa
        - fechaCreacion
      properties:
        id:
          type: integer
          format: int64
        codigo:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        version:
          type: integer
        expresion:
          type: string
        ejemplo:
          type: object
          nullable: true
          additionalProperties: true
          description: JSON de contexto recomendado para probar la formula.
        contratoEntrada:
          type: object
          nullable: true
          additionalProperties: true
          description: JSON Schema acotado usado por el MFE runtime para construir los campos de entrada.
        contratoSalida:
          type: object
          nullable: true
          additionalProperties: true
          description: JSON Schema opcional para describir la salida esperada.
        configuracionInterfaz:
          type: object
          nullable: true
          additionalProperties: true
          description: Configuracion declarativa de titulos, secciones y textos de la interfaz runtime.
        activa:
          type: boolean
        fechaCreacion:
          type: string
          format: date-time
        estado:
          type: string
          enum: [BORRADOR, PUBLICADA]
        creadoPor:
          type: string
        publicadoPor:
          type: string
          nullable: true
        fechaPublicacion:
          type: string
          format: date-time
          nullable: true
        activadoPor:
          type: string
          nullable: true
        fechaActivacion:
          type: string
          format: date-time
          nullable: true
    FormulaSaveRequest:
      type: object
      required:
        - codigo
        - nombre
        - expresion
        - ejemplo
      properties:
        codigo:
          type: string
          maxLength: 100
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
        nombre:
          type: string
          maxLength: 200
        descripcion:
          type: string
          nullable: true
          maxLength: 2000
        expresion:
          type: string
          maxLength: 100000
        ejemplo:
          type: object
          additionalProperties: true
        contratoEntrada:
          type: object
          nullable: true
          additionalProperties: true
        contratoSalida:
          type: object
          nullable: true
          additionalProperties: true
        configuracionInterfaz:
          type: object
          nullable: true
          additionalProperties: true
        creadoPor:
          type: string
          maxLength: 200
    FormulaLifecycleRequest:
      type: object
      properties:
        actor:
          type: string
          maxLength: 200
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
    CalculoRequest:
      type: object
      required:
        - idSolicitud
        - codigoFormula
        - parametros
      properties:
        idSolicitud:
          type: string
          maxLength: 100
        codigoFormula:
          type: string
          maxLength: 100
        parametros:
          type: object
          additionalProperties: true
    CalculoResponse:
      type: object
      properties:
        idEjecucion:
          type: integer
          format: int64
          nullable: true
        idSolicitud:
          type: string
        codigoFormula:
          type: string
        versionFormula:
          type: integer
          nullable: true
        parametros:
          type: object
          additionalProperties: true
        resultado:
          nullable: true
        tipoResultado:
          type: string
          nullable: true
        estado:
          type: string
          enum:
            - EXITOSO
            - SOLICITUD_INVALIDA
            - FORMULA_NO_ENCONTRADA
            - ERROR_CALCULO
        fechaInicio:
          type: string
          format: date-time
        fechaFin:
          type: string
          format: date-time
        duracionMs:
          type: integer
          format: int64
        error:
          type: string
          nullable: true
    AviatorSourceRequest:
      type: object
      required:
        - source
      properties:
        source:
          type: string
          maxLength: 100000
    AviatorSourceTestRequest:
      type: object
      required:
        - source
        - parametros
      properties:
        source:
          type: string
          maxLength: 100000
        parametros:
          type: object
          additionalProperties: true
    AviatorDiagnostic:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        line:
          type: integer
          nullable: true
        column:
          type: integer
          nullable: true
        severity:
          type: string
          enum: [error, warning]
    AviatorValidationResponse:
      type: object
      required:
        - contractVersion
        - engine
        - valid
        - diagnostics
      properties:
        contractVersion:
          type: integer
        engine:
          type: string
        valid:
          type: boolean
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/AviatorDiagnostic'
    AviatorSourceTestResponse:
      type: object
      required:
        - contractVersion
        - engine
        - success
        - executionTimeMs
      properties:
        contractVersion:
          type: integer
        engine:
          type: string
        success:
          type: boolean
        result:
          nullable: true
        executionTimeMs:
          type: integer
          format: int64
        error:
          type: string
          nullable: true
    AviatorVisualizationRequest:
      type: object
      required:
        - source
      properties:
        source:
          type: string
          maxLength: 10000
        includeSourceMapping:
          type: boolean
          default: true
    AviatorVisualizationResponse:
      type: object
      required:
        - valid
        - nodes
        - edges
        - diagnostics
      properties:
        valid:
          type: boolean
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/AviatorVisualizationNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/AviatorVisualizationEdge'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/AviatorVisualizationDiagnostic'
    AviatorVisualizationNode:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [start, end, process, decision, iteration, exception, return, function]
        label:
          type: string
        instruction:
          type: string
        sourceCode:
          type: string
        source:
          $ref: '#/components/schemas/AviatorSourceRange'
        referencedVariables:
          type: array
          items:
            type: string
        assignedVariables:
          type: array
          items:
            type: string
        branches:
          type: array
          items:
            $ref: '#/components/schemas/AviatorVisualizationBranch'
        previousIds:
          type: array
          items:
            type: string
        nextIds:
          type: array
          items:
            type: string
        synthetic:
          type: boolean
    AviatorVisualizationEdge:
      type: object
      properties:
        id:
          type: string
        source:
          type: string
        target:
          type: string
        label:
          type: string
          nullable: true
    AviatorVisualizationBranch:
      type: object
      properties:
        label:
          type: string
        targetId:
          type: string
    AviatorSourceRange:
      type: object
      properties:
        startLine:
          type: integer
        startColumn:
          type: integer
        endLine:
          type: integer
        endColumn:
          type: integer
    AviatorVisualizationDiagnostic:
      type: object
      properties:
        severity:
          type: string
          enum: [error, warning]
        message:
          type: string
        line:
          type: integer
          nullable: true
        column:
          type: integer
          nullable: true
